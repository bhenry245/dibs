[project]
name = "dibs-backend"
version = "0.1.0"
description = "Dibs API: split the bill at the table"
readme = "README.md"
authors = [
    { name = "Brandon Henry", email = "bhenry245@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dibs"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # isort: import ordering
    "B",   # flake8-bugbear: likely bugs
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
