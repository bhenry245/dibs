# Frontend CI: lint, type-check + build, and test the React app.
name: Frontend CI

on:
  push:
    branches: [main]
    paths: [frontend/**, .github/workflows/frontend.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/frontend.yml]

# Read-only token: this workflow never needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the run that's already going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # Same Node version as local dev: both read frontend/.nvmrc.
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly what package-lock.json says, and fails if the
      # lockfile is out of sync with package.json (the npm twin of `uv sync --locked`).
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` type-checks everything, then Vite produces the production bundle.
      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test
